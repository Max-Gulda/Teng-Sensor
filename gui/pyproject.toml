[project]
name = "ecg-belt-gui"
version = "0.1.0"
description = "Super simple GUI for ECG belt BLE streams with four-channel ADS131M04 support"
requires-python = ">=3.11"
dependencies = [
  "bleak>=0.22.0",
  "pyside6>=6.7.0",
  "pyqtgraph>=0.13.7",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg_belt_gui"]

[project.scripts]
ecg-belt-gui = "ecg_belt_gui.app:main"
