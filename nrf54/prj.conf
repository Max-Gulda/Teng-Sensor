CONFIG_SPI=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_OUTPUT=y
CONFIG_MAIN_STACK_SIZE=2048

# GRTC (Global Real-Time Counter) for 8.192 MHz clock output to ADC
CONFIG_NRF_GRTC_TIMER=y
CONFIG_NRF_GRTC_START_SYSCOUNTER=y

# GPIO support required for CS, SYNC/RESET and DRDY pins
CONFIG_GPIO=y
CONFIG_LOG_BUFFER_SIZE=8192

# Bluetooth Low Energy
CONFIG_BT=y
CONFIG_BT_NUS=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TENG_Scope"
# 0x0540 = Generic Sensor (BT SIG Assigned Numbers)
CONFIG_BT_DEVICE_APPEARANCE=1344
CONFIG_BT_MAX_CONN=2
CONFIG_BT_GAP_PERIPHERAL_PREF_PARAMS=y

# GATT configuration
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# MTU and buffer configuration for batching (20 samples = 240 bytes)
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# Increase stack sizes for BT
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# CPU load monitoring
CONFIG_CPU_LOAD=y

# Heap memory pool for BLE/MCUmgr support
CONFIG_HEAP_MEM_POOL_SIZE=32768

#CONFIG_NFCT_PINS_AS_GPIOS=y

# Nordic MCUmgr BLE OTA DFU - This handles all dependencies automatically
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y

# Optional: Authentication (recommended for production)
# CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN=y
